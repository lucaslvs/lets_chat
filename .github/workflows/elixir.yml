name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lets_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/lets_chat_test
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang, Elixir and Node via mise
        uses: jdx/mise-action@v2
        with:
          cache: true
        env:
          KERL_BUILD_DOCS: "no"
          MISE_YES: "1"

      - name: Restore deps and _build cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore Dialyzer PLT cache
        id: cache-plt
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-

      - name: Bust cache on retry
        if: github.run_attempt != '1'
        run: |
          mix deps.clean --all
          mix clean

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check unused deps
        run: mix deps.unlock --check-unused

      - name: Hex audit
        run: mix hex.audit

      - name: Deps security audit
        run: mix deps.audit

      - name: Credo
        run: mix credo --strict

      - name: Sobelow security analysis
        run: mix sobelow --skip --exit Low

      - name: Dialyzer
        run: mix dialyzer
        env:
          KERL_BUILD_DOCS: "no"
          MISE_YES: "1"

      # Note: Node.js / Vite assets are NOT built here.
      # live_vue uses ssr_module: nil in test env, so no JS runtime is needed.
      # If tests that require compiled Vue SSR assets are added in the future,
      # add a Node.js asset build step before this one.
      - name: Run tests
        run: mix test
